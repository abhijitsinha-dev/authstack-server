components:
  schemas:
    OtpSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Verification code sent to your email
        data:
          type: object
          properties:
            email:
              type: string
              example: john@example.com

    AuthSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation successful
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/UserResponse'
            accessToken:
              type: string
              # Block scalar — the value contains ": " which YAML would otherwise
              # parse as a key separator inside an inline scalar.
              description: |
                Short-lived JWT (15 min). Send as `Authorization: Bearer <token>`.
            refreshToken:
              type: string
              description: |
                **Mobile clients only.** Long-lived JWT (30 days) used to obtain
                new access tokens via `POST /api/v1/auth/refresh`.

                Web clients do **not** receive this in the JSON body — they receive
                it as an `HttpOnly` cookie via the `Set-Cookie` response header.

    LogoutSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Logged out successfully.

    ForgotPasswordSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: If an account exists with that email, a password reset code has been sent.

    ResetPasswordSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Password reset successfully. Please log in with your new password.

    RefreshSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            accessToken:
              type: string
              description: New short-lived JWT (15 min).
            refreshToken:
              type: string
              description: |
                **Mobile clients only.** The rotated refresh token. The old one
                is now invalid.

                Web clients receive this via the `Set-Cookie` header instead.

    MeSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/UserResponse'
