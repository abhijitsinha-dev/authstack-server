paths:
  /api/v1/auth/change-password:
    post:
      summary: Change the authenticated user's password
      description: |
        Changes the password of the currently authenticated user.

        **Requires the current password** — not just a valid session. This is
        proof of identity, not just proof of session. It closes the window
        where a stolen access token (valid for 15 min) could be used to take
        over the account by changing its password.

        **Revokes all OTHER sessions** on success but keeps the current one
        active. If a device was stolen and its session is still valid, the
        legitimate user stays logged in where they are doing the change,
        while the stolen device is logged out.
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, confirmPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                  description: The user's current password, verified against the stored hash.
                  example: OldPassword123!
                newPassword:
                  type: string
                  format: password
                  description: |
                    New password. Must be 8-72 characters, contain at least one
                    uppercase letter, one lowercase letter, one number, and one
                    symbol. Must differ from currentPassword.
                  example: NewPassword456!
                confirmPassword:
                  type: string
                  format: password
                  description: Must exactly match newPassword.
                  example: NewPassword456!
      responses:
        '200':
          description: |
            Password changed. Other sessions (if any) were revoked; the
            current session stays active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordSuccessResponse'
              examples:
                revoked_others:
                  summary: Other sessions existed and were revoked
                  value:
                    success: true
                    message: Password changed. Other devices have been logged out.
                    data:
                      revokedCount: 2
                no_other_sessions:
                  summary: No other sessions existed (only the current one)
                  value:
                    success: true
                    message: Password changed successfully.
                    data:
                      revokedCount: 0
        '400':
          description: Validation error or no-op password change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_current_password:
                  summary: Missing currentPassword
                  value: { success: false, message: 'Current password is required.' }
                missing_new_password:
                  summary: Missing newPassword
                  value: { success: false, message: 'Password is required.' }
                weak_new_password:
                  summary: Weak newPassword
                  value:
                    {
                      success: false,
                      message: 'Password must be at least 8 characters long and contain at least one uppercase letter, one lowercase letter, one number, and one symbol.',
                    }
                passwords_do_not_match:
                  summary: confirmPassword does not match newPassword
                  value: { success: false, message: 'Passwords do not match.' }
                same_as_current:
                  summary: newPassword equals currentPassword
                  value:
                    {
                      success: false,
                      message: 'New password must be different from current password.',
                    }
        '401':
          description: |
            Unauthorized. Covers four cases — three from the `protect`
            middleware (no token, invalid token, session revoked) and one
            from the service layer (wrong current password).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                no_token:
                  summary: Missing or malformed Authorization header
                  value: { success: false, message: 'Not authorized, no token provided' }
                invalid_token:
                  summary: Invalid or expired token
                  value: { success: false, message: 'Not authorized, token failed or expired' }
                session_revoked:
                  summary: Session has been revoked
                  value: { success: false, message: 'Session has been revoked or expired' }
                wrong_current_password:
                  summary: Current password is incorrect
                  value: { success: false, message: 'Current password is incorrect.' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/forgot-password:
    post:
      summary: Request a password reset
      description: |
        Sends a 6-digit OTP to the user's email to reset their password.

        **Anti-enumeration:** Always returns `200 OK` regardless of whether the email
        exists or is verified. An attacker cannot distinguish "email not found" from
        "email found" via this endpoint's response.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: john@example.com }
      responses:
        '200':
          description: Reset code sent (if email exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordSuccessResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_email:
                  summary: Missing Email
                  value: { success: false, message: 'Email is required.' }
                invalid_email:
                  summary: Invalid Email Format
                  value: { success: false, message: 'Please provide a valid email address.' }
        '429':
          $ref: '#/components/responses/RateLimitWithCooldown'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/reset-password:
    post:
      summary: Reset password with OTP
      description: Verifies the OTP and updates the user's password. All active sessions are revoked.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, newPassword, confirmPassword]
              properties:
                email: { type: string, format: email, example: john@example.com }
                otp: { type: string, example: '123456' }
                newPassword: { type: string, format: password, example: NewPassword123! }
                confirmPassword: { type: string, format: password, example: NewPassword123! }
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordSuccessResponse'
        '400':
          description: Validation error or invalid OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_email:
                  summary: Invalid Email Format
                  value: { success: false, message: 'Please provide a valid email address.' }
                invalid_otp_format:
                  summary: Invalid OTP Format
                  value: { success: false, message: 'OTP must be exactly 6 digits.' }
                weak_password:
                  summary: Weak Password
                  value:
                    {
                      success: false,
                      message: 'Password must be at least 8 characters long and contain at least one uppercase letter, one lowercase letter, one number, and one symbol.',
                    }
                passwords_do_not_match:
                  summary: Passwords Do Not Match
                  value: { success: false, message: 'Passwords do not match.' }
                invalid_request:
                  summary: Invalid Request (user not found)
                  value: { success: false, message: 'Invalid request.' }
                expired_otp:
                  summary: Expired or Missing OTP
                  value:
                    {
                      success: false,
                      message: 'OTP has expired or does not exist. Please request a new one.',
                    }
                invalid_otp:
                  summary: Invalid OTP Code
                  value:
                    { success: false, message: 'Invalid OTP code. You have 4 attempts remaining.' }
                otp_already_used:
                  summary: OTP Already Consumed
                  value:
                    {
                      success: false,
                      message: 'OTP has already been used. Please request a new one.',
                    }
        '429':
          description: OTP lockout or rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                otp_lockout:
                  summary: Maximum Verification Attempts Exceeded
                  value:
                    {
                      success: false,
                      message: 'Maximum verification attempts exceeded. Please request a new OTP.',
                    }
                ip_rate_limited:
                  summary: IP Rate Limited
                  value: { success: false, message: 'Too many requests. Please try again later.' }
        '500':
          $ref: '#/components/responses/InternalServerError'
