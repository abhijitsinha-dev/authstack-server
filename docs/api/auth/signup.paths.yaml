paths:
  /api/v1/auth/username-availability:
    get:
      summary: Check username availability
      description: Returns whether a username can be used. Reserved names are rejected; usernames owned by verified accounts are unavailable. Pending signup usernames can be reused.
      tags: [Auth]
      parameters:
        - in: query
          name: username
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 30
            pattern: '^[a-z0-9_.-]+$'
          example: john_doe
      responses:
        '200':
          $ref: '#/components/responses/UsernameAvailabilitySuccess'
        '400':
          $ref: '#/components/responses/UsernameAvailabilityBadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/email-availability:
    get:
      summary: Check email availability
      description: Returns whether an email address is available. Verified accounts make an email unavailable; emails on pending signups remain available for signup retry.
      tags: [Auth]
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
            format: email
            minLength: 5
            maxLength: 254
          example: john@example.com
      responses:
        '200':
          $ref: '#/components/responses/EmailAvailabilitySuccess'
        '400':
          $ref: '#/components/responses/EmailAvailabilityBadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/signup/request-otp:
    post:
      summary: Request an OTP for signup
      description: >-
        Creates an unverified user, generates a 6-digit OTP, and queues the email for delivery.
        Only verified accounts reserve an email or username. Pending signup records matching the
        requested email or username are replaced; the 24-hour TTL index removes abandoned records.
        The requested username must not belong to a verified account.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                  pattern: '^[a-z0-9_.-]+$'
                  example: john_doe.1-a
                  description: >-
                    Lowercase letters, numbers, underscores, hyphens, and periods only.
                    Reserved names (admin, support, root, api, help, security, noreply,
                    postmaster) cannot be used.
                email:
                  type: string
                  format: email
                  minLength: 5
                  maxLength: 254
                  example: john@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 72
                  example: Password123!
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSuccessResponse'
        '400':
          $ref: '#/components/responses/RequestOtpBadRequest'
        '409':
          $ref: '#/components/responses/RequestOtpConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: Server or email sending error

  /api/v1/auth/signup/resend-otp:
    post:
      summary: Resend signup OTP
      description: Generates a new OTP and sends it to the user's email. Enforces a 20-second cooldown.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: john@example.com }
      responses:
        '200':
          description: New OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSuccessResponse'
        '400':
          $ref: '#/components/responses/ResendOtpBadRequest'
        '404':
          $ref: '#/components/responses/ResendOtpNotFound'
        '429':
          $ref: '#/components/responses/RateLimitWithCooldown'
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: Failed to send email

  /api/v1/auth/signup/verify-otp:
    post:
      summary: Verify OTP and complete signup
      description: Verifies the 6-digit OTP. Marks the user as verified, creates a session, and issues JWT tokens.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string, format: email, example: john@example.com }
                otp: { type: string, example: '123456' }
      responses:
        '200':
          $ref: '#/components/responses/VerifyOtpSuccess'
        '400':
          $ref: '#/components/responses/VerifyOtpBadRequest'
        '404':
          $ref: '#/components/responses/VerifyOtpNotFound'
        '429':
          description: OTP lockout or IP rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                otp_lockout:
                  summary: Maximum Verification Attempts Exceeded
                  value:
                    {
                      success: false,
                      message: 'Maximum verification attempts exceeded. Please request a new OTP.',
                    }
                ip_rate_limited:
                  summary: IP Rate Limited
                  value: { success: false, message: 'Too many requests. Please try again later.' }
        '500':
          $ref: '#/components/responses/InternalServerError'
