paths:
  /api/v1/auth/signup/request-otp:
    post:
      summary: Request an OTP for signup
      description: Creates an unverified user, generates a 6-digit OTP, and sends it via email.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: john@example.com }
                password: { type: string, format: password, example: Password123! }
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSuccessResponse'
        '400':
          $ref: '#/components/responses/RequestOtpBadRequest'
        '409':
          $ref: '#/components/responses/RequestOtpConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: Server or email sending error

  /api/v1/auth/signup/resend-otp:
    post:
      summary: Resend signup OTP
      description: Generates a new OTP and sends it to the user's email. Enforces a 20-second cooldown.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: john@example.com }
      responses:
        '200':
          description: New OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSuccessResponse'
        '400':
          $ref: '#/components/responses/ResendOtpBadRequest'
        '404':
          $ref: '#/components/responses/ResendOtpNotFound'
        '429':
          $ref: '#/components/responses/RateLimitWithCooldown'
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: Failed to send email

  /api/v1/auth/signup/verify-otp:
    post:
      summary: Verify OTP and complete signup
      description: Verifies the 6-digit OTP. Marks the user as verified, creates a session, and issues JWT tokens.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string, format: email, example: john@example.com }
                otp: { type: string, example: '123456' }
      responses:
        '200':
          $ref: '#/components/responses/VerifyOtpSuccess'
        '400':
          $ref: '#/components/responses/VerifyOtpBadRequest'
        '404':
          $ref: '#/components/responses/VerifyOtpNotFound'
        '429':
          description: OTP lockout or IP rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                otp_lockout:
                  summary: Maximum Verification Attempts Exceeded
                  value:
                    {
                      success: false,
                      message: 'Maximum verification attempts exceeded. Please request a new OTP.',
                    }
                ip_rate_limited:
                  summary: IP Rate Limited
                  value: { success: false, message: 'Too many requests. Please try again later.' }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/login:
    post:
      summary: Log in to an existing account
      description: Authenticates the user. Returns an Access Token and sets a Refresh Token.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: john@example.com }
                password: { type: string, example: Password123! }
      responses:
        '200':
          $ref: '#/components/responses/LoginSuccess'
        '400':
          $ref: '#/components/responses/LoginBadRequest'
        '401':
          $ref: '#/components/responses/LoginUnauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token and issue a new access token
      description: |
        Exchanges a valid refresh token for a new access token. The refresh
        token is **rotated** — the old one is invalidated and a new one is
        issued. Clients MUST persist the new refresh token.

        **Client behavior:**

        - **Web:** refresh token is sent as an `HttpOnly` cookie (automatically
          by the browser). The rotated refresh token is set on a `Set-Cookie`
          header. Only `accessToken` is in the JSON body.
        - **Mobile:** refresh token is sent in the JSON body. Both new tokens
          are returned in the JSON body.

        **Reuse detection:** if the client presents a refresh token that has
        already been rotated (i.e., a replay), the entire session is revoked
        and all future refreshes for that session return `401`. The legitimate
        user will need to log in again.
      tags: [Auth]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: |
                    Mobile only. Web clients send the refresh token via the
                    `refreshToken` HttpOnly cookie — no body is required.
      responses:
        '200':
          $ref: '#/components/responses/RefreshSuccess'
        '401':
          description: |
            No token, invalid signature/expiry, session revoked, or **reuse
            detected**. Each case returns a distinct message — see examples.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                no_token:
                  summary: No refresh token provided
                  value: { success: false, message: 'No refresh token provided' }
                invalid_or_expired:
                  summary: Malformed, tampered, or expired refresh token
                  value: { success: false, message: 'Invalid or expired refresh token' }
                session_revoked:
                  summary: Session revoked (logout, password reset, or admin action)
                  value: { success: false, message: 'Session has been revoked or expired' }
                reuse_detected:
                  summary: Refresh token reuse detected — session revoked as a precaution
                  value:
                    {
                      success: false,
                      message: 'Refresh token reuse detected. Please log in again.',
                    }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/me:
    get:
      summary: Get the current authenticated user
      description: |
        Returns the profile of the user associated with the supplied access
        token. Used by clients on cold start (page reload, app restart) to
        hydrate UI state without a full login round-trip.

        The response shape is identical to the `user` field returned by
        `/login` and `/signup/verify-otp`, so clients can share the same
        parser.
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/MeSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/sessions:
    get:
      summary: List active sessions
      description: |
        Returns all non-revoked, non-expired sessions for the authenticated
        user, sorted by most recently used first.

        The session that made the current request is marked with
        `isCurrent: true` so clients can highlight "This device" in the UI.

        Response is `Cache-Control: no-store` — session data is per-user and
        must not be cached by proxies.
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of active sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsListResponse'
              example:
                success: true
                data:
                  sessions:
                    - id: '6af89c026af425f93f6785f1'
                      ip: '203.0.113.42'
                      userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120'
                      createdAt: '2026-11-14T17:36:02.297Z'
                      lastUsedAt: '2026-11-14T18:05:14.882Z'
                      isCurrent: true
                    - id: '6af89c036af425f93f6785f5'
                      ip: '198.51.100.7'
                      userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 14_0 like Mac OS X)'
                      createdAt: '2026-11-13T09:14:22.115Z'
                      lastUsedAt: '2026-11-13T09:14:22.115Z'
                      isCurrent: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Revoke all other sessions
      description: |
        Revokes every session for the authenticated user **except** the one
        making the request. Equivalent to "Log out of all other devices" —
        the caller stays logged in on their current device.

        Returns the number of sessions that were revoked. If the user has no
        other active sessions, the operation succeeds with `revokedCount: 0`
        (idempotent — callers don't need to check first).
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Other sessions revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Other sessions revoked.
                  data:
                    type: object
                    properties:
                      revokedCount:
                        type: integer
                        description: Number of sessions revoked (0 if none existed).
                        example: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/sessions/{id}:
    delete:
      summary: Revoke a specific session
      description: |
        Revokes a single session by ID — used when the user identifies a
        device they don't recognize in the sessions list and wants to kick
        it out without affecting their current device.

        **Cannot revoke the current session** via this endpoint. That's
        `POST /logout`'s job — it also clears the refresh cookie, which this
        endpoint doesn't. Attempting to revoke the current session returns
        `400`.

        **Anti-enumeration:** returns `404` for both non-existent session IDs
        and sessions belonging to other users. An attacker cannot use this
        endpoint to probe whether a session ID exists.
      tags: [Auth]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Session ID (MongoDB ObjectId).
          example: '6af89c036af425f93f6785f5'
      responses:
        '200':
          description: Session revoked successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Session revoked successfully.
        '400':
          description: Attempted to revoke the current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Cannot revoke the current session. Use logout instead.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Session not found (or belongs to another user).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Session not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/logout:
    post:
      summary: Log out of the current device
      description: Revokes the current session in the database and clears the refresh token cookie.
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/LogoutNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/change-email/request-otp:
    post:
      summary: Request OTP to change email
      description: |
        Step 1 of the email change flow. Verifies the user's current password
        and sends a 6-digit OTP to the **new** email address.

        **Requires currentPassword** — not just a valid session. This is
        proof of identity, not just proof of session. It closes the window
        where a stolen access token (valid for 15 min) could be used to
        redirect the account's recovery channel to an attacker-controlled
        address.

        **Synchronous delivery** via Brevo (unlike `forgot-password`) — the
        user is actively waiting for this code on an address they may not
        yet have confirmed. Silent failure would leave them stuck.

        **Rate limited** to 3 req/15 min per IP + 20s cooldown per user.
        Each request sends a real email (Brevo cost) and runs bcrypt (password
        verification), so tighter limits than most endpoints.

        **Note:** notification to the old email address is not yet
        implemented (industry-standard follow-up).
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newEmail, currentPassword]
              properties:
                newEmail:
                  type: string
                  format: email
                  description: The new email address to switch to.
                  example: new-address@example.com
                currentPassword:
                  type: string
                  format: password
                  description: The user's current password, verified against the stored hash.
                  example: OldPassword123!
      responses:
        '200':
          description: OTP sent to the new email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestEmailChangeSuccessResponse'
        '400':
          description: Validation error or same-email guard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_email:
                  summary: Invalid newEmail format
                  value: { success: false, message: 'Please provide a valid email address.' }
                missing_password:
                  summary: Missing currentPassword
                  value: { success: false, message: 'Current password is required.' }
                same_email:
                  summary: newEmail equals current email
                  value:
                    { success: false, message: 'New email must be different from current email.' }
        '401':
          description: Unauthorized or wrong current password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                no_token:
                  summary: Missing or malformed Authorization header
                  value: { success: false, message: 'Not authorized, no token provided' }
                wrong_current_password:
                  summary: Current password is incorrect
                  value: { success: false, message: 'Current password is incorrect.' }
        '409':
          description: Email already in use by another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: This email is already in use.
        '429':
          $ref: '#/components/responses/RateLimitWithCooldown'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/change-email/verify-otp:
    post:
      summary: Verify OTP and complete email change
      description: |
        Step 2 of the email change flow. Verifies the OTP sent to the new
        email address and commits the change.

        The OTP proves possession of the new address — that's the second
        factor on top of the session + password checked in step 1.

        **All OTHER sessions are revoked** on success (keeps the current one,
        same as `POST /change-password`) so a compromised device that triggered
        the change is logged out.

        **Atomic OTP consumption:** the OTP is deleted with
        `findOneAndDelete` _before_ the email is updated. A concurrent replay
        cannot hijack the change.

        **Post-verification collision check:** if another user registered
        `newEmail` between request-otp and verify-otp, a `409` is returned.
        The unique index on `User.email` is the final safety net — this
        pre-check gives the user a clean error before the save attempt.
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newEmail, otp]
              properties:
                newEmail:
                  type: string
                  format: email
                  description: The new email address (must match the one used in request-otp).
                  example: new-address@example.com
                otp:
                  type: string
                  description: 6-digit code sent to `newEmail`.
                  example: '123456'
      responses:
        '200':
          description: Email changed successfully. Other sessions (if any) were revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailChangeSuccessResponse'
        '400':
          description: Validation error, invalid OTP, or same-email guard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_email:
                  summary: Invalid newEmail format
                  value: { success: false, message: 'Please provide a valid email address.' }
                invalid_otp_format:
                  summary: OTP format not 6 digits
                  value: { success: false, message: 'OTP must be exactly 6 digits.' }
                same_email:
                  summary: newEmail equals current email
                  value:
                    { success: false, message: 'New email must be different from current email.' }
                expired_otp:
                  summary: OTP expired or missing
                  value:
                    {
                      success: false,
                      message: 'OTP has expired or does not exist. Please request a new one.',
                    }
                invalid_otp:
                  summary: Wrong OTP code
                  value:
                    { success: false, message: 'Invalid OTP code. You have 4 attempts remaining.' }
                otp_used:
                  summary: OTP already consumed (concurrent request)
                  value:
                    {
                      success: false,
                      message: 'OTP has already been used. Please request a new one.',
                    }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Email claimed by another user during the OTP window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: This email is already in use.
        '429':
          description: OTP lockout or rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                otp_lockout:
                  summary: Maximum verification attempts exceeded
                  value:
                    {
                      success: false,
                      message: 'Maximum verification attempts exceeded. Please request a new OTP.',
                    }
                ip_rate_limited:
                  summary: IP rate limited
                  value: { success: false, message: 'Too many requests. Please try again later.' }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/change-password:
    post:
      summary: Change the authenticated user's password
      description: |
        Changes the password of the currently authenticated user.

        **Requires the current password** — not just a valid session. This is
        proof of identity, not just proof of session. It closes the window
        where a stolen access token (valid for 15 min) could be used to take
        over the account by changing its password.

        **Revokes all OTHER sessions** on success but keeps the current one
        active. If a device was stolen and its session is still valid, the
        legitimate user stays logged in where they are doing the change,
        while the stolen device is logged out.
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, confirmPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                  description: The user's current password, verified against the stored hash.
                  example: OldPassword123!
                newPassword:
                  type: string
                  format: password
                  description: |
                    New password. Must be 8-72 characters, contain at least one
                    uppercase letter, one lowercase letter, one number, and one
                    symbol. Must differ from currentPassword.
                  example: NewPassword456!
                confirmPassword:
                  type: string
                  format: password
                  description: Must exactly match newPassword.
                  example: NewPassword456!
      responses:
        '200':
          description: |
            Password changed. Other sessions (if any) were revoked; the
            current session stays active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordSuccessResponse'
              examples:
                revoked_others:
                  summary: Other sessions existed and were revoked
                  value:
                    success: true
                    message: Password changed. Other devices have been logged out.
                    data:
                      revokedCount: 2
                no_other_sessions:
                  summary: No other sessions existed (only the current one)
                  value:
                    success: true
                    message: Password changed successfully.
                    data:
                      revokedCount: 0
        '400':
          description: Validation error or no-op password change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_current_password:
                  summary: Missing currentPassword
                  value: { success: false, message: 'Current password is required.' }
                missing_new_password:
                  summary: Missing newPassword
                  value: { success: false, message: 'Password is required.' }
                weak_new_password:
                  summary: Weak newPassword
                  value:
                    {
                      success: false,
                      message: 'Password must be at least 8 characters long and contain at least one uppercase letter, one lowercase letter, one number, and one symbol.',
                    }
                passwords_do_not_match:
                  summary: confirmPassword does not match newPassword
                  value: { success: false, message: 'Passwords do not match.' }
                same_as_current:
                  summary: newPassword equals currentPassword
                  value:
                    {
                      success: false,
                      message: 'New password must be different from current password.',
                    }
        '401':
          description: |
            Unauthorized. Covers four cases — three from the `protect`
            middleware (no token, invalid token, session revoked) and one
            from the service layer (wrong current password).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                no_token:
                  summary: Missing or malformed Authorization header
                  value: { success: false, message: 'Not authorized, no token provided' }
                invalid_token:
                  summary: Invalid or expired token
                  value: { success: false, message: 'Not authorized, token failed or expired' }
                session_revoked:
                  summary: Session has been revoked
                  value: { success: false, message: 'Session has been revoked or expired' }
                wrong_current_password:
                  summary: Current password is incorrect
                  value: { success: false, message: 'Current password is incorrect.' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/forgot-password:
    post:
      summary: Request a password reset
      description: |
        Sends a 6-digit OTP to the user's email to reset their password.

        **Anti-enumeration:** Always returns `200 OK` regardless of whether the email
        exists or is verified. An attacker cannot distinguish "email not found" from
        "email found" via this endpoint's response.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: john@example.com }
      responses:
        '200':
          description: Reset code sent (if email exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordSuccessResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_email:
                  summary: Missing Email
                  value: { success: false, message: 'Email is required.' }
                invalid_email:
                  summary: Invalid Email Format
                  value: { success: false, message: 'Please provide a valid email address.' }
        '429':
          $ref: '#/components/responses/RateLimitWithCooldown'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/reset-password:
    post:
      summary: Reset password with OTP
      description: Verifies the OTP and updates the user's password. All active sessions are revoked.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, newPassword, confirmPassword]
              properties:
                email: { type: string, format: email, example: john@example.com }
                otp: { type: string, example: '123456' }
                newPassword: { type: string, format: password, example: NewPassword123! }
                confirmPassword: { type: string, format: password, example: NewPassword123! }
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordSuccessResponse'
        '400':
          description: Validation error or invalid OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_email:
                  summary: Invalid Email Format
                  value: { success: false, message: 'Please provide a valid email address.' }
                invalid_otp_format:
                  summary: Invalid OTP Format
                  value: { success: false, message: 'OTP must be exactly 6 digits.' }
                weak_password:
                  summary: Weak Password
                  value:
                    {
                      success: false,
                      message: 'Password must be at least 8 characters long and contain at least one uppercase letter, one lowercase letter, one number, and one symbol.',
                    }
                passwords_do_not_match:
                  summary: Passwords Do Not Match
                  value: { success: false, message: 'Passwords do not match.' }
                invalid_request:
                  summary: Invalid Request (user not found)
                  value: { success: false, message: 'Invalid request.' }
                expired_otp:
                  summary: Expired or Missing OTP
                  value:
                    {
                      success: false,
                      message: 'OTP has expired or does not exist. Please request a new one.',
                    }
                invalid_otp:
                  summary: Invalid OTP Code
                  value:
                    { success: false, message: 'Invalid OTP code. You have 4 attempts remaining.' }
                otp_already_used:
                  summary: OTP Already Consumed
                  value:
                    {
                      success: false,
                      message: 'OTP has already been used. Please request a new one.',
                    }
        '429':
          description: OTP lockout or rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                otp_lockout:
                  summary: Maximum Verification Attempts Exceeded
                  value:
                    {
                      success: false,
                      message: 'Maximum verification attempts exceeded. Please request a new OTP.',
                    }
                ip_rate_limited:
                  summary: IP Rate Limited
                  value: { success: false, message: 'Too many requests. Please try again later.' }
        '500':
          $ref: '#/components/responses/InternalServerError'
