paths:
  /api/v1/auth/signup/request-otp:
    post:
      summary: Request an OTP for signup
      description: Creates an unverified user, generates a 6-digit OTP, and sends it via email.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: John Doe }
                email: { type: string, format: email, example: john@example.com }
                password: { type: string, format: password, example: Password123! }
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSuccessResponse'
        '400':
          $ref: '#/components/responses/RequestOtpBadRequest'
        '409':
          $ref: '#/components/responses/RequestOtpConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: Server or email sending error

  /api/v1/auth/signup/resend-otp:
    post:
      summary: Resend signup OTP
      description: Generates a new OTP and sends it to the user's email. Enforces a 20-second cooldown.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: john@example.com }
      responses:
        '200':
          description: New OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSuccessResponse'
        '400':
          $ref: '#/components/responses/ResendOtpBadRequest'
        '404':
          $ref: '#/components/responses/ResendOtpNotFound'
        '429':
          $ref: '#/components/responses/RateLimitWithCooldown'
        '500':
          $ref: '#/components/responses/InternalServerError'
          description: Failed to send email

  /api/v1/auth/signup/verify-otp:
    post:
      summary: Verify OTP and complete signup
      description: Verifies the 6-digit OTP. Marks the user as verified, creates a session, and issues JWT tokens.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string, format: email, example: john@example.com }
                otp: { type: string, example: '123456' }
      responses:
        '200':
          $ref: '#/components/responses/VerifyOtpSuccess'
        '400':
          $ref: '#/components/responses/VerifyOtpBadRequest'
        '404':
          $ref: '#/components/responses/VerifyOtpNotFound'
        '429':
          description: OTP lockout or IP rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                otp_lockout:
                  summary: Maximum Verification Attempts Exceeded
                  value:
                    {
                      success: false,
                      message: 'Maximum verification attempts exceeded. Please request a new OTP.',
                    }
                ip_rate_limited:
                  summary: IP Rate Limited
                  value: { success: false, message: 'Too many requests. Please try again later.' }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/login:
    post:
      summary: Log in to an existing account
      description: Authenticates the user. Returns an Access Token and sets a Refresh Token.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: john@example.com }
                password: { type: string, example: Password123! }
      responses:
        '200':
          $ref: '#/components/responses/LoginSuccess'
        '400':
          $ref: '#/components/responses/LoginBadRequest'
        '401':
          $ref: '#/components/responses/LoginUnauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token and issue a new access token
      description: |
        Exchanges a valid refresh token for a new access token. The refresh
        token is **rotated** — the old one is invalidated and a new one is
        issued. Clients MUST persist the new refresh token.

        **Client behavior:**

        - **Web:** refresh token is sent as an `HttpOnly` cookie (automatically
          by the browser). The rotated refresh token is set on a `Set-Cookie`
          header. Only `accessToken` is in the JSON body.
        - **Mobile:** refresh token is sent in the JSON body. Both new tokens
          are returned in the JSON body.

        **Reuse detection:** if the client presents a refresh token that has
        already been rotated (i.e., a replay), the entire session is revoked
        and all future refreshes for that session return `401`. The legitimate
        user will need to log in again.
      tags: [Auth]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: |
                    Mobile only. Web clients send the refresh token via the
                    `refreshToken` HttpOnly cookie — no body is required.
      responses:
        '200':
          $ref: '#/components/responses/RefreshSuccess'
        '401':
          description: |
            No token, invalid signature/expiry, session revoked, or **reuse
            detected**. Each case returns a distinct message — see examples.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                no_token:
                  summary: No refresh token provided
                  value: { success: false, message: 'No refresh token provided' }
                invalid_or_expired:
                  summary: Malformed, tampered, or expired refresh token
                  value: { success: false, message: 'Invalid or expired refresh token' }
                session_revoked:
                  summary: Session revoked (logout, password reset, or admin action)
                  value: { success: false, message: 'Session has been revoked or expired' }
                reuse_detected:
                  summary: Refresh token reuse detected — session revoked as a precaution
                  value:
                    {
                      success: false,
                      message: 'Refresh token reuse detected. Please log in again.',
                    }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/me:
    get:
      summary: Get the current authenticated user
      description: |
        Returns the profile of the user associated with the supplied access
        token. Used by clients on cold start (page reload, app restart) to
        hydrate UI state without a full login round-trip.

        The response shape is identical to the `user` field returned by
        `/login` and `/signup/verify-otp`, so clients can share the same
        parser.
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/MeSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/logout:
    post:
      summary: Log out of the current device
      description: Revokes the current session in the database and clears the refresh token cookie.
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/LogoutNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/forgot-password:
    post:
      summary: Request a password reset
      description: |
        Sends a 6-digit OTP to the user's email to reset their password.

        **Anti-enumeration:** Always returns `200 OK` regardless of whether the email
        exists or is verified. An attacker cannot distinguish "email not found" from
        "email found" via this endpoint's response.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: john@example.com }
      responses:
        '200':
          description: Reset code sent (if email exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordSuccessResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_email:
                  summary: Missing Email
                  value: { success: false, message: 'Email is required.' }
                invalid_email:
                  summary: Invalid Email Format
                  value: { success: false, message: 'Please provide a valid email address.' }
        '429':
          $ref: '#/components/responses/RateLimitWithCooldown'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/reset-password:
    post:
      summary: Reset password with OTP
      description: Verifies the OTP and updates the user's password. All active sessions are revoked.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, newPassword, confirmPassword]
              properties:
                email: { type: string, format: email, example: john@example.com }
                otp: { type: string, example: '123456' }
                newPassword: { type: string, format: password, example: NewPassword123! }
                confirmPassword: { type: string, format: password, example: NewPassword123! }
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordSuccessResponse'
        '400':
          description: Validation error or invalid OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_email:
                  summary: Invalid Email Format
                  value: { success: false, message: 'Please provide a valid email address.' }
                invalid_otp_format:
                  summary: Invalid OTP Format
                  value: { success: false, message: 'OTP must be exactly 6 digits.' }
                weak_password:
                  summary: Weak Password
                  value:
                    {
                      success: false,
                      message: 'Password must be at least 8 characters long and contain at least one uppercase letter, one lowercase letter, one number, and one symbol.',
                    }
                passwords_do_not_match:
                  summary: Passwords Do Not Match
                  value: { success: false, message: 'Passwords do not match.' }
                invalid_request:
                  summary: Invalid Request (user not found)
                  value: { success: false, message: 'Invalid request.' }
                expired_otp:
                  summary: Expired or Missing OTP
                  value:
                    {
                      success: false,
                      message: 'OTP has expired or does not exist. Please request a new one.',
                    }
                invalid_otp:
                  summary: Invalid OTP Code
                  value:
                    { success: false, message: 'Invalid OTP code. You have 4 attempts remaining.' }
                otp_already_used:
                  summary: OTP Already Consumed
                  value:
                    {
                      success: false,
                      message: 'OTP has already been used. Please request a new one.',
                    }
        '429':
          description: OTP lockout or rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                otp_lockout:
                  summary: Maximum Verification Attempts Exceeded
                  value:
                    {
                      success: false,
                      message: 'Maximum verification attempts exceeded. Please request a new OTP.',
                    }
                ip_rate_limited:
                  summary: IP Rate Limited
                  value: { success: false, message: 'Too many requests. Please try again later.' }
        '500':
          $ref: '#/components/responses/InternalServerError'
