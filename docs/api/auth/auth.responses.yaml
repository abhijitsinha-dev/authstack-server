components:
  responses:
    # ─────────────────────────────────────────────
    # Request OTP Responses
    # ─────────────────────────────────────────────
    RequestOtpBadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing_name:
              summary: Missing Name
              value: { success: false, message: 'Name is required.' }
            missing_email:
              summary: Missing Email
              value: { success: false, message: 'Email is required.' }
            missing_password:
              summary: Missing Password
              value: { success: false, message: 'Password is required.' }
            invalid_email:
              summary: Invalid Email Format
              value: { success: false, message: 'Please provide a valid email address.' }
            weak_password:
              summary: Weak Password
              value:
                {
                  success: false,
                  message: 'Password must be at least 8 characters long and contain at least one uppercase letter, one lowercase letter, one number, and one symbol.',
                }

    RequestOtpConflict:
      description: Email already exists and is verified
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            { success: false, message: 'An account with this email already exists. Please log in.' }

    # ─────────────────────────────────────────────
    # Resend OTP Responses
    # ─────────────────────────────────────────────
    ResendOtpBadRequest:
      description: User is already verified or invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            already_verified:
              summary: Account Already Verified
              value: { success: false, message: 'Account is already verified. Please log in.' }
            invalid_email:
              summary: Invalid Email Format
              value: { success: false, message: 'Please provide a valid email address.' }

    ResendOtpNotFound:
      description: User not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example: { success: false, message: 'User not found. Please sign up first.' }

    # ─────────────────────────────────────────────
    # Verify OTP Responses
    # ─────────────────────────────────────────────
    VerifyOtpSuccess:
      description: |
        Successfully verified. The response shape depends on the client:

        - **Web clients** — `refreshToken` is set as an `HttpOnly` cookie
          (see the `Set-Cookie` response header). The JSON body contains only
          `accessToken`.
        - **Mobile clients** — both `accessToken` and `refreshToken` are
          returned in the JSON body. No `Set-Cookie` header.
      headers:
        Set-Cookie:
          description: |
            **Web clients only.** Contains the `refreshToken` cookie:
            `refreshToken=<jwt>; HttpOnly; SameSite=Strict; Secure (in prod)`.

            Mobile clients do not receive this header.
          schema:
            type: string
            example: refreshToken=eyJhbGciOi...; Path=/; HttpOnly; SameSite=Strict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthSuccessResponse'
          examples:
            web:
              summary: Web client — refreshToken in Set-Cookie
              value:
                success: true
                message: Account verified successfully
                data:
                  user:
                    id: '60d5ecb8b392d7001f3f4e1a'
                    name: 'John Doe'
                    email: 'john@example.com'
                    role: 'user'
                  accessToken: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
            mobile:
              summary: Mobile client — refreshToken in response body
              value:
                success: true
                message: Account verified successfully
                data:
                  user:
                    id: '60d5ecb8b392d7001f3f4e1a'
                    name: 'John Doe'
                    email: 'john@example.com'
                    role: 'user'
                  accessToken: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                  refreshToken: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'

    VerifyOtpBadRequest:
      description: Invalid OTP or user already verified
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_otp:
              summary: Invalid OTP Code
              value: { success: false, message: 'Invalid OTP code. You have 4 attempts remaining.' }
            expired_otp:
              summary: Expired or Missing OTP
              value:
                {
                  success: false,
                  message: 'OTP has expired or does not exist. Please request a new one.',
                }
            already_verified:
              summary: User Already Verified
              value: { success: false, message: 'User is already verified. Please log in.' }
            invalid_email:
              summary: Invalid Email Format
              value: { success: false, message: 'Please provide a valid email address.' }
            invalid_otp_format:
              summary: Invalid OTP Format
              value: { success: false, message: 'OTP must be exactly 6 digits.' }

    VerifyOtpNotFound:
      description: User not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example: { success: false, message: 'User not found. Please sign up first.' }

    # ─────────────────────────────────────────────
    # Login Responses
    # ─────────────────────────────────────────────
    LoginSuccess:
      description: |
        Successfully logged in. The response shape depends on the client:

        - **Web clients** — `refreshToken` is set as an `HttpOnly` cookie
          (see the `Set-Cookie` response header). The JSON body contains only
          `accessToken`.
        - **Mobile clients** — both `accessToken` and `refreshToken` are
          returned in the JSON body. No `Set-Cookie` header.
      headers:
        Set-Cookie:
          description: |
            **Web clients only.** Contains the `refreshToken` cookie:
            `refreshToken=<jwt>; HttpOnly; SameSite=Strict; Secure (in prod)`.

            Mobile clients do not receive this header.
          schema:
            type: string
            example: refreshToken=eyJhbGciOi...; Path=/; HttpOnly; SameSite=Strict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthSuccessResponse'
          examples:
            web:
              summary: Web client — refreshToken in Set-Cookie
              value:
                success: true
                message: Logged in successfully
                data:
                  user:
                    id: '60d5ecb8b392d7001f3f4e1a'
                    name: 'John Doe'
                    email: 'john@example.com'
                    role: 'user'
                  accessToken: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
            mobile:
              summary: Mobile client — refreshToken in response body
              value:
                success: true
                message: Logged in successfully
                data:
                  user:
                    id: '60d5ecb8b392d7001f3f4e1a'
                    name: 'John Doe'
                    email: 'john@example.com'
                    role: 'user'
                  accessToken: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                  refreshToken: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'

    LoginBadRequest:
      description: Validation error (e.g., missing fields, invalid email)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing_email:
              summary: Missing Email
              value: { success: false, message: 'Email is required.' }
            missing_password:
              summary: Missing Password
              value: { success: false, message: 'Password is required.' }
            invalid_email:
              summary: Invalid Email Format
              value: { success: false, message: 'Invalid email or password.' }

    LoginUnauthorized:
      description: Invalid email or password
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example: { success: false, message: 'Invalid email or password.' }

    # ─────────────────────────────────────────────
    # NEW: Refresh Token Responses
    # ─────────────────────────────────────────────
    RefreshSuccess:
      description: |
        Refresh token successfully rotated. The response shape depends on the
        client:

        - **Web clients** — the rotated `refreshToken` is set as an `HttpOnly`
          cookie (see `Set-Cookie` header). The JSON body contains only
          `accessToken`.
        - **Mobile clients** — both `accessToken` and the rotated `refreshToken`
          are returned in the JSON body. No `Set-Cookie` header.

        **Clients MUST persist the new refresh token** — the old one is now
        invalid. Presenting the old token again will trigger reuse detection
        and revoke the entire session.
      headers:
        Set-Cookie:
          description: |
            **Web clients only.** Contains the rotated `refreshToken` cookie:
            `refreshToken=<jwt>; HttpOnly; SameSite=Strict; Secure (in prod)`.
          schema:
            type: string
            example: refreshToken=eyJhbGciOi...; Path=/; HttpOnly; SameSite=Strict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefreshSuccessResponse'
          examples:
            web:
              summary: Web client — rotated refreshToken in Set-Cookie
              value:
                success: true
                data:
                  accessToken: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
            mobile:
              summary: Mobile client — both tokens in response body
              value:
                success: true
                data:
                  accessToken: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                  refreshToken: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'

    # ─────────────────────────────────────────────
    # NEW: Current User Response
    # ─────────────────────────────────────────────
    MeSuccess:
      description: |
        Current authenticated user's profile. Response shape matches the
        `user` field returned by `/login` and `/signup/verify-otp`, so
        clients can share the same parser.

        The response is marked `Cache-Control: no-store` — user data must
        never be cached by proxies or shared caches.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MeSuccessResponse'
          example:
            success: true
            data:
              user:
                id: '60d5ecb8b392d7001f3f4e1a'
                name: 'John Doe'
                email: 'john@example.com'
                role: 'user'

    # ─────────────────────────────────────────────
    # Logout Responses
    # ─────────────────────────────────────────────
    LogoutNotFound:
      description: |
        Session not found — a rare race condition where the session was deleted
        between the `protect` middleware's existence check and `logoutUser()`
        revoking it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example: { success: false, message: 'Session not found or already logged out.' }

    # ─────────────────────────────────────────────
    # Rate Limits & Lockouts
    # ─────────────────────────────────────────────
    RateLimitWithCooldown:
      description: Rate limit exceeded (IP limit or 20-second email cooldown)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            cooldown_active:
              summary: Email Cooldown Active
              value:
                { success: false, message: 'Please wait 15 seconds before requesting a new code.' }
            ip_rate_limited:
              summary: IP Rate Limited
              value: { success: false, message: 'Too many requests. Please try again later.' }

    OTPLockout:
      description: Maximum verification attempts exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            {
              success: false,
              message: 'Maximum verification attempts exceeded. Please request a new OTP.',
            }

    EmailNotVerified:
      description: Email not verified
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example: { success: false, message: 'Please verify your email before logging in.' }
